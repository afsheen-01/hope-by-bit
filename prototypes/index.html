<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hope By Bit — the prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- Two families, which is the ceiling techSpec/web/ui.md enforces. -->
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Infant:wght@300;400&family=Rubik:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="screen.css">
<link rel="stylesheet" href="onboarding.css">
</head>
<body>
  <!-- One phone, one flow: five questions, the handoff, then the day's
       story. Nothing on the page but the device, so the prototype is
       walked the way the app is used rather than read as a gallery. -->
  <div class="stage">
    <div id="app"></div>
    <div id="switches"></div>
  </div>

  <script src="screen.js"></script>
  <script src="onboarding.js"></script>
  <script>
    var app = document.getElementById('app');
    var switches = document.getElementById('switches');

    /* Onboarding runs in Auto — the picker does not exist until the
       questions are answered, and then it is the only page control. */
    HopeByBitOnboarding.mount(app, function () {
      HopeByBit.mountBit(app);
      HopeByBit.mountSwitches(switches);
    });
  </script>
</body>
</html>
